<html lang="en">
<head>

    <title>Phaser Card Game TCG Prototype</title>
    
    <!-- LOAD PHASER: Pull the game engine framework from a CDN -->
    <script src="vendor/phaserjs/phaser.min.js"></script>

            align-items: center;
